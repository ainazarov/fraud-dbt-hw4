name: fraud-dbt-hw4

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3.6.56
    environment:
      CLICKHOUSE_USER: hw4
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-hw4_local}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/homework.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1"']
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  tools:
    image: fraud-dbt-hw4-tools:local
    build: .
    profiles: [tools]
    working_dir: /workspace
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      HW4_CONTAINER: '1'
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: '8123'
      CLICKHOUSE_USER: hw4
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-hw4_local}
      DBT_PROJECT_DIR: /workspace/dbt
      DBT_PROFILES_DIR: /workspace/dbt
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      PRE_COMMIT_HOME: /tmp/pre-commit
      PYTHONPATH: /app
    volumes:
      - .:/workspace:ro
      - ./dbt:/workspace/dbt
      - ./data:/data:ro
      - ./results:/results
    depends_on:
      clickhouse:
        condition: service_healthy

  docs:
    image: fraud-dbt-hw4-tools:local
    build: .
    profiles: [docs]
    working_dir: /workspace/dbt
    environment:
      DBT_PROFILES_DIR: /workspace/dbt
      DBT_LOG_PATH: /tmp/dbt-docs-logs
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
    volumes:
      - ./dbt:/workspace/dbt:ro
      - ./dbt/target:/workspace/dbt/target
    ports:
      - '127.0.0.1:${DOCS_PORT:-8080}:8080'
    command: [dbt, docs, serve, --no-browser, --host, 0.0.0.0, --port, '8080']

volumes:
  clickhouse_data:
