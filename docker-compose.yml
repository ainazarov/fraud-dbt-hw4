name: fraud-analytics-hw2

x-client: &client
  image: fraud-analytics-hw2-client:local
  build: .
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_TOPIC: transactions
    CLICKHOUSE_URL: http://clickhouse:8123
    CLICKHOUSE_USER: default
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-hw2_local}
  volumes:
    - ${DATA_DIR:-./data}:/data:ro
    - ./results:/results

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # The bundled JDK 11 otherwise crashes on some modern cgroup-v2 hosts.
      JAVA_TOOL_OPTIONS: '-XX:-UseContainerSupport -XX:ActiveProcessorCount=2'
      KAFKA_HEAP_OPTS: '-Xms128m -Xmx256m'
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: [CMD, cub, zk-ready, 'localhost:2181', '5']
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: '-Xms256m -Xmx512m'
      JAVA_TOOL_OPTIONS: '-XX:-UseContainerSupport -XX:ActiveProcessorCount=2'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [CMD, kafka-topics, --bootstrap-server, kafka:9092, --list]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.3.0
    environment:
      JAVA_TOOL_OPTIONS: '-XX:-UseContainerSupport -XX:ActiveProcessorCount=2'
      KAFKA_HEAP_OPTS: '-Xms128m -Xmx256m'
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [/bin/bash, -ec]
    command:
      - kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions --partitions 3 --replication-factor 1

  clickhouse:
    image: clickhouse/clickhouse-server:25.3.6.56
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-hw2_local}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/hw2.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  schema-init:
    image: clickhouse/clickhouse-server:25.3.6.56
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-hw2_local}
    volumes:
      - ./sql:/sql:ro
    entrypoint: [/bin/bash, -ec]
    command:
      - clickhouse-client --host clickhouse --password "$$CLICKHOUSE_PASSWORD" --multiquery < /sql/001_schema.sql

  producer:
    <<: *client
    profiles: [tools]
    depends_on:
      schema-init:
        condition: service_completed_successfully
    entrypoint: [python, scripts/produce.py]
    command: [/app/data/demo.csv, --dataset, demo, --manifest, /results/manifest_demo.json]

  verify:
    <<: *client
    profiles: [tools]
    depends_on:
      schema-init:
        condition: service_completed_successfully
    entrypoint: [python, scripts/verify.py]
    command: [/app/data/demo.csv, --dataset, demo, --output-dir, /results]

  benchmark:
    <<: *client
    profiles: [tools]
    entrypoint: [python, scripts/benchmark.py]
    command: [--dataset, demo, --output-dir, /results]

  tests:
    <<: *client
    profiles: [test]

volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  clickhouse_data:
