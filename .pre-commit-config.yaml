repos:
  - repo: local
    hooks:
      - id: sqlfluff-lint
        name: SQLFluff (ClickHouse/dbt)
        entry: bash scripts/in_tools.sh sh -c 'sqlfluff lint --config .sqlfluff dbt/models dbt/tests/*.sql'
        language: system
        pass_filenames: false
        files: ^dbt/(models|macros)/.*\.sql$|^dbt/tests/[^/]+\.sql$
      - id: sqlfluff-unit-fixtures
        name: SQLFluff (ClickHouse unit fixtures)
        entry: bash scripts/in_tools.sh sqlfluff lint --config .sqlfluff --templater raw
        language: system
        files: ^dbt/tests/fixtures/.*\.sql$
      - id: importer-tests
        name: CSV snapshot importer tests
        entry: bash scripts/in_tools.sh python -m unittest discover -s tests -p test_load_hw4.py -v
        language: system
        pass_filenames: false
        files: ^(scripts/load_hw4\.py|tests/test_load_hw4\.py)$
