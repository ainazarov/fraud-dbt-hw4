fraud_hw4:
  target: dev
  outputs:
    dev:
      type: clickhouse
      schema: fraud_analytics
      host: "{{ env_var('CLICKHOUSE_HOST', 'clickhouse') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'hw4') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'hw4_local') }}"
      secure: false
      verify: false
      threads: 4
      connect_timeout: 10
      send_receive_timeout: 300
